name: 'Adaptive6 Prevent Waste In Action'
description: 'Prevent waste in PRs'
inputs:
  a6p-api-token:
    description: 'Token for A6P API'
    required: true
  github-token:
    description: 'GitHub token'
    required: true
  ghcr-token:
    description: 'GitHub Container Registry token for pulling the Docker image'
    required: false
    default: ''
  ghcr-user:
    description: 'GitHub Container Registry username'
    required: false
    default: 'adaptive6-bot'
  a6-url:
    description: 'Adaptive6 API URL'
    required: false
    default: 'https://api.adaptive6.com/api'
  image-name:
    description: 'Docker image name'
    required: false
    default: 'ghcr.io/adaptive6/a6-p-cli'
  image-tag:
    description: 'Docker image tag'
    required: false
    default: 'latest'
  iac-files-dir:
    description: 'Directory to store IaC files for scanning'
    required: false
    default: 'iac_files'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    # Event data (PR title, branch names) is controlled by whoever opens the PR. It reaches the
    # shell only through env variables, always quoted, never as ${{ }} inside run:.
    - name: Fetch base branch
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: git fetch origin -- "${BASE_REF}"

    - name: Fetch head branch
      shell: bash
      env:
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: git fetch origin -- "${HEAD_REF}"

    - name: Get list of changed IaC files
      id: changed-files
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        SHA: ${{ github.sha }}
      run: |
        # Terraform .tf files are always IaC. For .yaml/.yml/.json, only
        # include files containing AWSTemplateFormatVersion or AWS:: so we
        # don't sweep up unrelated config (CI manifests, app YAML, etc.).
        CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}" "${SHA}" --)
        : > changed-files.txt
        echo "$CHANGED_FILES" | grep -E '\.tf$' >> changed-files.txt || true
        while IFS= read -r file; do
          [ -z "$file" ] && continue
          if [ -f "$file" ] && grep -qE 'AWSTemplateFormatVersion|AWS::' -- "$file" 2>/dev/null; then
            echo "$file" >> changed-files.txt
          fi
        done < <(echo "$CHANGED_FILES" | grep -E '\.(yaml|yml|json)$' || true)

    - name: Copy changed files to directory
      shell: bash
      env:
        IAC_DIR: ${{ inputs.iac-files-dir }}
      run: |
        mkdir -p "${IAC_DIR}"
        while IFS= read -r file; do
          [ -z "$file" ] && continue
          if [ -f "$file" ]; then
            mkdir -p "${IAC_DIR}/$(dirname -- "$file")"
            cp -- "$file" "${IAC_DIR}/$file"
          fi
        done < changed-files.txt

    - name: Print Params
      shell: bash
      env:
        A6_URL: ${{ inputs.a6-url }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        COMMIT: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        IMAGE: ${{ inputs.image-name }}:${{ inputs.image-tag }}
        IAC_DIR: ${{ inputs.iac-files-dir }}
      run: |
          echo
          echo "-------------------------------------------------------------------"
          echo "|                                                                 |"
          echo "|            _       _             _   _            __            |"
          echo "|           / \   __| | __ _ _ __ | |_(_)_   _____ / /_           |"
          echo "|          / _ \ / _\` |/ _\` | '_ \| __| \ \ / / _ \ '_ \          |"
          echo "|         / ___ \ (_| | (_| | |_) | |_| |\ V /  __/ (_) |         |"
          echo "|        /_/   \_\__,_|\__,_| .__/ \__|_| \_/ \___|\___/          |"
          echo "|                           |_|                                   |"
          echo "|                                                                 |"
          echo "-------------------------------------------------------------------"
          printf '%s\n' "url: ${A6_URL}" "repo-owner: ${REPO_OWNER}" "repo: ${REPO}" "branch: ${BRANCH}" \
            "commit: ${COMMIT}" "pull-request-number: ${PR_NUMBER}" "pull-request-title: ${PR_TITLE}" \
            "image: ${IMAGE}" "iac-files-dir: ${IAC_DIR}"
          echo "-------------------------------------------------------------------"

    - name: Login to GHCR
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
        GHCR_USER: ${{ inputs.ghcr-user }}
      run: |
        if [ -z "${GHCR_TOKEN}" ]; then
          echo "::error::ghcr-token is required to pull the Docker image. Contact your Adaptive6 representative to obtain the token."
          exit 1
        fi
        echo "Logging into GitHub Container Registry..."
        printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

    - name: Pull Docker image
      shell: bash
      env:
        DOCKER_IMAGE: ${{ inputs.image-name }}:${{ inputs.image-tag }}
      run: |
        echo "Pulling Docker image: ${DOCKER_IMAGE}..."
        if ! docker pull "${DOCKER_IMAGE}"; then
          echo "::error::Failed to pull Docker image: ${DOCKER_IMAGE}"
          exit 1
        fi

    - name: Run Docker container
      shell: bash
      env:
        DOCKER_IMAGE: ${{ inputs.image-name }}:${{ inputs.image-tag }}
        IAC_DIR: ${{ inputs.iac-files-dir }}
        WORKSPACE: ${{ github.workspace }}
        A6_URL: ${{ inputs.a6-url }}
        A6P_API_TOKEN: ${{ inputs.a6p-api-token }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        COMMIT: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        cp changed-files.txt "${IAC_DIR}/changed-files.txt"
        echo "Running Docker scan..."
        docker run -v "${WORKSPACE}/${IAC_DIR}:/${IAC_DIR}" \
            "${DOCKER_IMAGE}" \
            --path "/${IAC_DIR}" \
            --url "${A6_URL}" \
            --api-key "${A6P_API_TOKEN}" \
            --repo-owner "${REPO_OWNER}" \
            --repo "${REPO}" \
            --branch "${BRANCH}" \
            --commit "${COMMIT}" \
            --pull-request-number "${PR_NUMBER}" \
            --pull-request-title "${PR_TITLE}" \
            --scan-source "github" \
            --changed-files-txt "/${IAC_DIR}/changed-files.txt" \
            2>&1 | tee cli_output.json

    - name: Print CLI output
      shell: bash
      run: cat cli_output.json

    # Call the new action because otherwise we don't have the files in the workspace
    - name: Parse and Annotate Results
      uses: adaptive6/actions/preventive/dist@main
      id: parse_results
      with:
        github-token: ${{ inputs.github-token }}
        iac-files-dir: ${{ inputs.iac-files-dir }}

    - name: Set Conclusion
      shell: bash
      if: steps.parse_results.outputs.check_conclusion == 'failure'
      run: exit 1
